<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Stadium Gacha</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg,
                    #0b3d2e 0%,
                    #12633f 45%,
                    #08251d 100%);
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            padding: 30px 0 60px;
            text-align: center;
        }

        /* ヘッダー */

        .header {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 3px;
        }

        .subtitle {
            margin-top: 10px;
            color: #d7f7df;
        }

        /* ポイント */

        .point {
            display: inline-block;
            background: #111;
            padding: 10px 25px;
            border-radius: 30px;
            margin-top: 15px;
            font-size: 20px;
        }

        /* ガチャボタン */

        .buttons {
            margin: 25px 0;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 16px 30px;
            margin: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .single {
            background: #ffffff;
            color: #12633f;
        }

        .ten {
            background: #ffd43b;
            color: #222;
        }

        .collection {
            background: #ffffff;
            color: #12633f;
        }

        /* ピッチ風の結果エリア */

        .pitch {
            position: relative;
            background:
                repeating-linear-gradient(90deg,
                    #177245 0px,
                    #177245 70px,
                    #1b7c4c 70px,
                    #1b7c4c 140px);

            border: 4px solid white;
            border-radius: 20px;
            padding: 35px 20px;
            margin-top: 30px;

            box-shadow:
                inset 0 0 40px rgba(0, 0, 0, 0.25),
                0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .pitch::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.7);
        }

        .pitch-title {
            position: relative;
            z-index: 2;
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* スタジアムカード */

        .stadium-card {
            position: relative;
            z-index: 2;

            background: rgba(0, 0, 0, 0.75);
            border-radius: 18px;

            padding: 20px;
            margin: 15px auto;

            max-width: 650px;

            border: 2px solid rgba(255, 255, 255, 0.25);

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);

            text-align: left;
        }

        .stadium-name {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stadium-info {
            color: #dcefe3;
            line-height: 1.7;
        }

        .rarity {
            display: inline-block;

            background: #ffd43b;
            color: #222;

            padding: 5px 12px;
            border-radius: 20px;

            font-weight: bold;

            margin-top: 10px;
        }

        .draw-number {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            font-weight: bold;
        }


        /* レア度別カード */

/* N */
.rarity-n {
    border: 2px solid rgba(255, 255, 255, 0.25);
}

/* R */
.rarity-r {
    border: 2px solid #4da6ff;
    box-shadow: 0 0 15px rgba(77, 166, 255, 0.35);
}

/* SR */
.rarity-sr {
    border: 2px solid #ffd43b;
    box-shadow: 0 0 20px rgba(255, 212, 59, 0.45);
}

/* SSR */
.rarity-ssr {
    border: 2px solid #ff9f43;
    box-shadow:
        0 0 20px rgba(255, 159, 67, 0.6),
        0 0 40px rgba(255, 212, 59, 0.25);
}

/* UR */
.rarity-ur {
    border: 3px solid #ffffff;
    box-shadow:
        0 0 20px rgba(255, 255, 255, 0.9),
        0 0 45px rgba(255, 212, 59, 0.8),
        0 0 80px rgba(255, 255, 255, 0.5);

    background: linear-gradient(
        135deg,
        rgba(80, 60, 20, 0.95),
        rgba(20, 20, 20, 0.95)
    );
}


/* SSR・UR 特別演出 */

.special-title {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
    animation: glow 1.2s infinite alternate;
}

.ur-title {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    margin-bottom: 15px;
    animation: urGlow 0.8s infinite alternate;
}

@keyframes glow {
    from {
        text-shadow: 0 0 5px #ffd43b;
    }

    to {
        text-shadow:
            0 0 10px #ffd43b,
            0 0 25px #ff9f43;
    }
}

@keyframes urGlow {
    from {
        transform: scale(1);
        text-shadow:
            0 0 10px white,
            0 0 20px #ffd43b;
    }

    to {
        transform: scale(1.05);
        text-shadow:
            0 0 20px white,
            0 0 40px #ffd43b,
            0 0 60px #ffffff;
    }
}


        /* フッター */

        .footer {
            margin-top: 30px;
            color: #b8d9c4;
            font-size: 14px;
        }
    </style>

</head>


<body>

    <div class="container">

        <div class="header">

            <h1>⚽ STADIUM GACHA</h1>

            <div class="subtitle">
                スタジアムを集めて、日本全国を旅しよう。
            </div>

            <div class="point">
                💎 1000 pt
            </div>

        </div>


        <div class="buttons">

            <button class="single" onclick="drawGacha()">
                ⚽ 1回引く
            </button>

            <button class="ten" onclick="drawTenGacha()">
                🔥 10回引く
            </button>

            <button class="collection" onclick="showCollection()">
                📚 コレクションを見る
            </button>

        </div>


        <div class="pitch">

            <div class="pitch-title">
                🏟️ STADIUM COLLECTION
            </div>

            <div id="result">

                <p>
                    ガチャを引いて<br>
                    あなたのスタジアムを見つけよう！
                </p>

            </div>

        </div>


        <div class="footer">
            ✈️ Stadium × Football × Travel
        </div>

    </div>


    <script>

        async function drawGacha() {

                const response = await fetch("/api/gacha");

                const stadium = await response.json();

                const rarityClass =
                    "rarity-" + stadium.rarity.toLowerCase();

                let specialEffect = "";

                if (stadium.rarity === "UR") {

                    specialEffect = `
            <div class="ur-title">
                ✨✨✨ LEGENDARY ✨✨✨
            </div>
        `;

                } else if (stadium.rarity === "SSR") {

                    specialEffect = `
            <div class="special-title">
                🔥 SPECIAL STADIUM 🔥
            </div>
        `;
                }

                document.getElementById("result").innerHTML = `

        <div class="stadium-card ${rarityClass}">

            ${specialEffect}

            <div class="stadium-name">
                🏟️ ${stadium.name}
            </div>

            <div class="stadium-info">

                📍 ${stadium.prefecture}<br>

                ⚽ ホームチーム：
                ${stadium.homeTeam}<br>

                👥 収容人数：
                ${stadium.capacity}人<br>

                <span class="rarity">
                    ⭐ ${stadium.rarity}
                </span>

            </div>

        </div>
        `;
        }


        async function drawTenGacha() {

                const response = await fetch("/api/gacha/ten");

                const stadiums = await response.json();

                const result = document.getElementById("result");

                // 最初に結果を空にする
                result.innerHTML = "";

                for (let i = 0; i < stadiums.length; i++) {

                    const stadium = stadiums[i];

                    const rarityClass =
                        "rarity-" + stadium.rarity.toLowerCase();

                    let specialEffect = "";

                    // UR演出
                    if (stadium.rarity === "UR") {

                        specialEffect = `
                <div class="ur-title">
                    ✨✨✨ LEGENDARY ✨✨✨
                </div>
            `;

                        // SSR演出
                    } else if (stadium.rarity === "SSR") {

                        specialEffect = `
                <div class="special-title">
                    🔥 SPECIAL STADIUM 🔥
                </div>
            `;
                    }

                    // 10回目は特別表示
                    let lastMessage = "";

                    if (i === 9) {

                        lastMessage = `
                <div class="special-title">
                    🎁 SR以上確定！
                </div>
            `;
                    }

                    // カードを追加
                    result.innerHTML += `
            <div class="stadium-card ${rarityClass}">

                <div class="draw-number">
                    ${i + 1}回目
                </div>

                ${lastMessage}

                ${specialEffect}

                <div class="stadium-name">
                    🏟️ ${stadium.name}
                </div>

                <div class="stadium-info">

                    📍 ${stadium.prefecture}<br>

                    ⚽ ホームチーム：
                    ${stadium.homeTeam}<br>

                    👥 収容人数：
                    ${stadium.capacity}人<br>

                    <span class="rarity">
                        ⭐ ${stadium.rarity}
                    </span>

                </div>

            </div>
        `;

                    // 0.5秒待つ
                    await wait(500);
                }
        }

        function wait(milliseconds) {

                return new Promise(resolve => {
                    setTimeout(resolve, milliseconds);
                });
            }
        
            
            async function showCollection() {

                    const response = await fetch("/api/collection");

                    const collections = await response.json();

                    let results = "";

                    if (collections.length === 0) {

                        results = `
                            <div class="stadium-card">
                                <div class="stadium-name">
                                    📚 コレクション
                                </div>

                                <div class="stadium-info">
                                    まだスタジアムを持っていません。
                                    <br>
                                    ガチャを引いてスタジアムを集めよう！
                                </div>
                            </div>
                        `;

                    } else {

                        for (const collection of collections) {

                            const stadium = collection.stadium;

                            const rarityClass =
                                "rarity-" + stadium.rarity.toLowerCase();

                            results += `
                                <div class="stadium-card ${rarityClass}">

                                    <div class="stadium-name">
                                        🏟️ ${stadium.name}
                                    </div>

                                    <div class="stadium-info">

                                        📍 ${stadium.prefecture}<br>

                                        ⚽ ホームチーム：
                                        ${stadium.homeTeam}<br>

                                        👥 収容人数：
                                        ${stadium.capacity}人<br>

                                        ⭐ レア度：
                                        ${stadium.rarity}<br>

                                        🎫 所持数：
                                        ×${collection.quantity}

                                    </div>

                                </div>
                            `;
                        }
                    }

                    document.getElementById("result").innerHTML = results;
        }
        

                

    </script>

</body>

</html>
